<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Panel V&V Consultores</title>
  <style>
    :root{--bg:#0f1026;--card:#1a1d33;--text:#fff;--sub:#c7c9e3;--accent:#d4af37}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    body{background:radial-gradient(1200px 800px at 20% 10%,#20234a,transparent),var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.4);border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    h1{font-size:22px;margin-bottom:6px}
    p{color:var(--sub);font-size:14px;margin-bottom:18px}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    input{background:transparent;border:1px solid rgba(199,201,227,.4);color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px}
    button{width:100%;background:linear-gradient(90deg,#b99a2b,#d4af37);border:none;color:#1b1f36;font-weight:700;padding:11px 14px;border-radius:999px;cursor:pointer}
    .msg{font-size:13px;color:#ffd7d7;margin-top:10px;min-height:18px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Panel de Mantenimiento</h1>
    <p>V&V Consultores · Solo para el encargado</p>
    <div class="field">
      <label for="clave">Clave de acceso</label>
      <input id="clave" type="password" autocomplete="off" placeholder="Ingresa tu clave">
    </div>
    <button id="btnEntrar">Entrar</button>
    <div class="msg" id="msg"></div>
  </div>
  <script src="/admin/login.js" defer></script>
</body>
</html>
